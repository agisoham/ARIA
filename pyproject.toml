[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-core"
version = "0.0.1"
description = "Survivability-first quant tooling for ARIA — validation harness and honest metrics."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    # `timezone.utc` is kept over the 3.11-only `datetime.UTC` alias so the module also runs
    # on older interpreters — portability is worth more here than the newer spelling.
    "UP017",
    # Files can carry the executable bit from a Windows/OneDrive checkout; this is a library,
    # not a set of scripts, so a missing shebang is not a defect.
    "EXE002",
]
